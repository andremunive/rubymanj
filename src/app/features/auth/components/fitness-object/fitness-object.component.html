<ng-container [ngSwitch]="type">

  <!-- DUMBBELL -->
  <svg
    *ngSwitchCase="'dumbbell'"
    [attr.width]="size"
    [attr.height]="size"
    viewBox="0 0 200 200"
    aria-hidden="true"
  >
    <defs>
      <radialGradient [id]="uid + '-dbL'" cx="30%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="18%" stop-color="#fbe7ff" />
        <stop offset="55%" stop-color="#cb6ce6" />
        <stop offset="100%" stop-color="#6b2d87" />
      </radialGradient>
      <radialGradient [id]="uid + '-dbR'" cx="70%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="18%" stop-color="#fbe7ff" />
        <stop offset="55%" stop-color="#cb6ce6" />
        <stop offset="100%" stop-color="#6b2d87" />
      </radialGradient>
      <linearGradient [id]="uid + '-dbBar'" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff6fc" />
        <stop offset="40%" stop-color="#e3c7ee" />
        <stop offset="100%" stop-color="#8a5ea0" />
      </linearGradient>
      <filter [id]="uid + '-dbShadow'" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
        <feOffset dx="0" dy="6" result="o" />
        <feComponentTransfer><feFuncA type="linear" slope="0.35" /></feComponentTransfer>
        <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
    <g [attr.filter]="'url(#' + uid + '-dbShadow)'">
      <rect x="60" y="92" width="80" height="16" rx="4" [attr.fill]="'url(#' + uid + '-dbBar)'" />
      <rect x="28" y="60" width="40" height="80" rx="10" [attr.fill]="'url(#' + uid + '-dbL)'" />
      <ellipse cx="40" cy="78" rx="8" ry="14" fill="#ffffff" opacity="0.55" />
      <rect x="132" y="60" width="40" height="80" rx="10" [attr.fill]="'url(#' + uid + '-dbR)'" />
      <ellipse cx="160" cy="78" rx="8" ry="14" fill="#ffffff" opacity="0.55" />
    </g>
  </svg>

  <!-- KETTLEBELL -->
  <svg
    *ngSwitchCase="'kettlebell'"
    [attr.width]="size"
    [attr.height]="size"
    viewBox="0 0 200 200"
    aria-hidden="true"
  >
    <defs>
      <radialGradient [id]="uid + '-kbBall'" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="15%" stop-color="#f8dcff" />
        <stop offset="55%" stop-color="#cb6ce6" />
        <stop offset="100%" stop-color="#5a2376" />
      </radialGradient>
      <linearGradient [id]="uid + '-kbHandle'" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff0fb" />
        <stop offset="50%" stop-color="#d6aee7" />
        <stop offset="100%" stop-color="#6f3d89" />
      </linearGradient>
      <filter [id]="uid + '-kbShadow'" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
        <feOffset dx="0" dy="6" result="o" />
        <feComponentTransfer><feFuncA type="linear" slope="0.35" /></feComponentTransfer>
        <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
    <g [attr.filter]="'url(#' + uid + '-kbShadow)'">
      <path
        d="M 62 60 Q 100 14 138 60 L 128 76 Q 100 44 72 76 Z"
        [attr.fill]="'url(#' + uid + '-kbHandle)'"
      />
      <circle cx="100" cy="128" r="58" [attr.fill]="'url(#' + uid + '-kbBall)'" />
      <ellipse
        cx="80"
        cy="108"
        rx="14"
        ry="22"
        fill="#ffffff"
        opacity="0.55"
        transform="rotate(-20 80 108)"
      />
      <ellipse cx="100" cy="186" rx="42" ry="4" fill="#000000" opacity="0.12" />
    </g>
  </svg>

  <!-- WATER BOTTLE -->
  <svg
    *ngSwitchCase="'bottle'"
    [attr.width]="size"
    [attr.height]="bottleHeight"
    viewBox="0 0 140 220"
    aria-hidden="true"
  >
    <defs>
      <linearGradient [id]="uid + '-bodyG'" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f0d7fb" />
        <stop offset="25%" stop-color="#ffffff" />
        <stop offset="55%" stop-color="#e4bff3" />
        <stop offset="100%" stop-color="#8b4ba8" />
      </linearGradient>
      <linearGradient [id]="uid + '-capG'" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#e5a8f5" />
        <stop offset="50%" stop-color="#cb6ce6" />
        <stop offset="100%" stop-color="#7a3a95" />
      </linearGradient>
      <linearGradient [id]="uid + '-hiG'" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      </linearGradient>
      <filter [id]="uid + '-btShadow'" x="-30%" y="-20%" width="160%" height="150%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
        <feOffset dy="8" result="o" />
        <feComponentTransfer><feFuncA type="linear" slope="0.35" /></feComponentTransfer>
        <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
    <g [attr.filter]="'url(#' + uid + '-btShadow)'">
      <rect x="24" y="48" width="92" height="160" rx="28" [attr.fill]="'url(#' + uid + '-bodyG)'" />
      <rect x="34" y="62" width="22" height="130" rx="11" [attr.fill]="'url(#' + uid + '-hiG)'" />
      <rect x="50" y="28" width="40" height="28" rx="6" fill="#b386c6" />
      <rect x="44" y="8" width="52" height="30" rx="8" [attr.fill]="'url(#' + uid + '-capG)'" />
      <rect x="50" y="14" width="14" height="18" rx="3" fill="#ffffff" opacity="0.35" />
      <rect x="24" y="108" width="92" height="30" fill="#ffffff" opacity="0.55" />
    </g>
  </svg>

  <!-- SPHERE -->
  <svg
    *ngSwitchCase="'sphere'"
    [attr.width]="size"
    [attr.height]="size"
    viewBox="0 0 120 120"
    aria-hidden="true"
  >
    <defs>
      <radialGradient [id]="uid + '-sph'" cx="32%" cy="28%" r="75%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="18%" [attr.stop-color]="'oklch(0.95 0.05 ' + hue + ')'" />
        <stop offset="60%" [attr.stop-color]="'oklch(0.75 0.16 ' + hue + ')'" />
        <stop offset="100%" [attr.stop-color]="'oklch(0.40 0.14 ' + hue + ')'" />
      </radialGradient>
    </defs>
    <circle cx="60" cy="60" r="54" [attr.fill]="'url(#' + uid + '-sph)'" />
    <ellipse
      cx="44"
      cy="42"
      rx="10"
      ry="14"
      fill="#ffffff"
      opacity="0.55"
      transform="rotate(-20 44 42)"
    />
    <ellipse cx="60" cy="112" rx="36" ry="3" fill="#000000" opacity="0.1" />
  </svg>

</ng-container>
