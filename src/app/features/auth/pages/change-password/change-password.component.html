<app-auth-layout>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

    <header class="auth-form__intro">
      <h1 class="auth-form__title">Crea tu contraseña</h1>
      <p class="auth-form__subtitle">
        Es la primera vez que inicias sesión. Por seguridad, define una contraseña nueva.
      </p>
    </header>

    <!-- Error del servidor -->
    <app-alert *ngIf="errorMensaje" variant="danger">
      {{ errorMensaje }}
    </app-alert>

    <div class="auth-form__fields">

      <!-- Nueva contraseña -->
      <div class="field-wrapper">
        <label class="field" [class.field--error]="nuevaError" for="nueva-password">
          <span class="field__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="11" width="16" height="10" rx="2"></rect>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
          </span>
          <input
            #nuevaInput
            class="field__input"
            [type]="mostrarNueva ? 'text' : 'password'"
            id="nueva-password"
            name="nueva-password"
            autocomplete="new-password"
            placeholder="Nueva contraseña"
            formControlName="nueva"
            [attr.aria-invalid]="nuevaError ? 'true' : 'false'"
            aria-describedby="nueva-error"
          />
          <button
            type="button"
            class="field__toggle"
            (click)="mostrarNueva = !mostrarNueva"
            [attr.aria-label]="mostrarNueva ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <svg *ngIf="mostrarNueva" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="!mostrarNueva" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </label>
        <span
          *ngIf="nuevaError"
          id="nueva-error"
          class="field-error"
          role="alert"
          aria-live="polite"
        >{{ nuevaError }}</span>
        <span class="field-hint">Mínimo 8 caracteres, una mayúscula y un número.</span>
      </div>

      <!-- Confirmar contraseña -->
      <div class="field-wrapper">
        <label class="field" [class.field--error]="confirmarError" for="confirmar-password">
          <span class="field__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
          </span>
          <input
            class="field__input"
            [type]="mostrarConfirmar ? 'text' : 'password'"
            id="confirmar-password"
            name="confirmar-password"
            autocomplete="new-password"
            placeholder="Confirmar contraseña"
            formControlName="confirmar"
            [attr.aria-invalid]="confirmarError ? 'true' : 'false'"
            aria-describedby="confirmar-error"
          />
          <button
            type="button"
            class="field__toggle"
            (click)="mostrarConfirmar = !mostrarConfirmar"
            [attr.aria-label]="mostrarConfirmar ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <svg *ngIf="mostrarConfirmar" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="!mostrarConfirmar" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </label>
        <span
          *ngIf="confirmarError"
          id="confirmar-error"
          class="field-error"
          role="alert"
          aria-live="polite"
        >{{ confirmarError }}</span>
      </div>

    </div>

    <button
      type="submit"
      class="btn-3d btn-3d--primary"
      [disabled]="guardando"
      [attr.aria-busy]="guardando"
    >
      <span class="btn-3d__label">
        <app-spinner *ngIf="guardando" [size]="18" class="btn-spinner"></app-spinner>
        {{ guardando ? 'Guardando…' : 'Guardar contraseña' }}
      </span>
      <span class="btn-3d__gloss" aria-hidden="true"></span>
    </button>

  </form>
</app-auth-layout>
