<app-auth-layout>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

    <header class="auth-form__intro">
      <h1 class="auth-form__title">{{ titulo }}</h1>
      <p class="auth-form__subtitle">{{ subtitulo }}</p>
    </header>

    <!-- Error global del servidor -->
    <app-alert *ngIf="errorMensaje" variant="danger">
      {{ errorMensaje }}
    </app-alert>

    <div class="auth-form__fields">

      <!-- Email -->
      <div class="field-wrapper">
        <label class="field" [class.field--error]="emailError">
          <span class="field__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3 7 9 6 9-6"></path>
            </svg>
          </span>
          <input
            #emailInput
            class="field__input"
            type="email"
            id="login-email"
            name="email"
            autocomplete="email"
            placeholder="tu@correo.com"
            formControlName="email"
            [attr.aria-invalid]="emailError ? 'true' : 'false'"
            aria-describedby="login-email-error"
          />
        </label>
        <span
          *ngIf="emailError"
          id="login-email-error"
          class="field-error"
          role="alert"
          aria-live="polite"
        >{{ emailError }}</span>
      </div>

      <!-- Contraseña -->
      <div class="field-wrapper">
        <label class="field" [class.field--error]="passwordError">
          <span class="field__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="11" width="16" height="10" rx="2"></rect>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
          </span>
          <input
            class="field__input"
            [type]="showPassword ? 'text' : 'password'"
            id="login-password"
            name="password"
            autocomplete="current-password"
            placeholder="Tu contraseña"
            formControlName="password"
            [attr.aria-invalid]="passwordError ? 'true' : 'false'"
            aria-describedby="login-password-error"
          />
          <button
            type="button"
            class="field__toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <!-- Ojo visible -->
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Ojo oculto -->
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </label>
        <span
          *ngIf="passwordError"
          id="login-password-error"
          class="field-error"
          role="alert"
          aria-live="polite"
        >{{ passwordError }}</span>
      </div>

    </div>

    <div class="auth-form__row">
      <a class="auth-form__link" routerLink="/auth/forgot-password">
        ¿Olvidaste tu contraseña?
      </a>
    </div>

    <button
      type="submit"
      class="btn-3d btn-3d--primary"
      [disabled]="cargando"
      [attr.aria-busy]="cargando"
    >
      <span class="btn-3d__label">
        <app-spinner *ngIf="cargando" [size]="18" class="btn-spinner"></app-spinner>
        {{ cargando ? 'Iniciando sesión…' : 'Iniciar sesión' }}
      </span>
      <span class="btn-3d__gloss" aria-hidden="true"></span>
    </button>

    <p class="auth-form__hint">
      ¿Aún no tienes una cuenta? Pídele acceso a Ruby.
    </p>

  </form>
</app-auth-layout>
