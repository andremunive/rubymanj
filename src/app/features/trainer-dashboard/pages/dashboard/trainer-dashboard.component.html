<div class="dashboard">
  <div class="dashboard__greeting">
    <h1 class="dashboard__title">
      Bienvenida, <span class="dashboard__name">{{ user?.fullName }}</span>
    </h1>
    <p class="dashboard__date">
      <span class="dashboard__fecha">{{ fechaBogota }}</span>
      <span class="dashboard__hora">{{ horaBogota }}</span>
    </p>
  </div>

  <div class="dashboard__cards">
    <div class="dashboard__card dashboard__card--placeholder">
      <p class="dashboard__placeholder-text">
        Las funcionalidades del panel de entrenadora se irán habilitando en próximas fases.
      </p>
    </div>
  </div>
</div>
