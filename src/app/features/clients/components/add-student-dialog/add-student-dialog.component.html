<!-- Backdrop + focus trap container -->
<div
  class="dialog-backdrop"
  role="presentation"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
>
  <div
    class="dialog-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialog-title"
    aria-describedby="dialog-description"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
  >

    <!-- Header -->
    <div class="dialog-panel__header">
      <div>
        <h2 id="dialog-title" class="dialog-panel__title">Añadir nueva alumna</h2>
        <p id="dialog-description" class="dialog-panel__description">
          Completa los datos. La alumna podrá cambiar su contraseña en su primer inicio de sesión.
        </p>
      </div>
      <button
        type="button"
        class="dialog-panel__close-btn"
        (click)="onCancel()"
        aria-label="Cerrar diálogo"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Form -->
    <form
      class="dialog-panel__form"
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      novalidate
    >

      <!-- Nombre completo -->
      <div class="form-field">
        <label class="form-field__label" for="add-fullName">
          Nombre completo <span class="form-field__required" aria-hidden="true">*</span>
        </label>
        <input
          id="add-fullName"
          type="text"
          class="form-field__input"
          [class.form-field__input--error]="fullNameError"
          formControlName="fullName"
          autocomplete="name"
          placeholder="Ej. María López"
          [attr.aria-invalid]="fullNameError ? 'true' : 'false'"
          aria-describedby="add-fullName-error"
        />
        <span
          *ngIf="fullNameError"
          id="add-fullName-error"
          class="form-field__error"
          role="alert"
          aria-live="polite"
        >{{ fullNameError }}</span>
      </div>

      <!-- Email -->
      <div class="form-field">
        <label class="form-field__label" for="add-email">
          Correo electrónico <span class="form-field__required" aria-hidden="true">*</span>
        </label>
        <input
          id="add-email"
          type="email"
          class="form-field__input"
          [class.form-field__input--error]="emailError"
          formControlName="email"
          autocomplete="email"
          placeholder="alumna@correo.com"
          [attr.aria-invalid]="emailError ? 'true' : 'false'"
          aria-describedby="add-email-error"
        />
        <span
          *ngIf="emailError"
          id="add-email-error"
          class="form-field__error"
          role="alert"
          aria-live="polite"
        >{{ emailError }}</span>
      </div>

      <!-- Contraseña -->
      <div class="form-field">
        <label class="form-field__label" for="add-password">
          Contraseña inicial <span class="form-field__required" aria-hidden="true">*</span>
        </label>
        <div class="form-field__input-wrapper">
          <input
            id="add-password"
            [type]="showPassword ? 'text' : 'password'"
            class="form-field__input form-field__input--with-toggle"
            [class.form-field__input--error]="passwordError"
            formControlName="password"
            autocomplete="new-password"
            placeholder="Mínimo 6 caracteres"
            [attr.aria-invalid]="passwordError ? 'true' : 'false'"
            aria-describedby="add-password-error"
          />
          <button
            type="button"
            class="form-field__toggle-btn"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            tabindex="0"
          >
            <!-- Eye open -->
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye closed -->
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span
          *ngIf="passwordError"
          id="add-password-error"
          class="form-field__error"
          role="alert"
          aria-live="polite"
        >{{ passwordError }}</span>
      </div>

      <!-- Teléfono (opcional) -->
      <div class="form-field">
        <label class="form-field__label" for="add-phone">
          Teléfono
          <span class="form-field__optional">(opcional)</span>
        </label>
        <input
          id="add-phone"
          type="tel"
          class="form-field__input"
          formControlName="phone"
          autocomplete="tel"
          placeholder="Ej. +57 300 000 0000"
        />
      </div>

      <!-- Fecha de nacimiento (opcional) -->
      <div class="form-field">
        <label class="form-field__label" for="add-birthDate">
          Fecha de nacimiento
          <span class="form-field__optional">(opcional)</span>
        </label>
        <input
          id="add-birthDate"
          type="date"
          class="form-field__input"
          formControlName="birthDate"
          [max]="today"
        />
      </div>

      <!-- Notas (opcional) -->
      <div class="form-field">
        <label class="form-field__label" for="add-notes">
          Notas internas
          <span class="form-field__optional">(opcional)</span>
        </label>
        <textarea
          id="add-notes"
          class="form-field__textarea"
          formControlName="notes"
          rows="3"
          placeholder="Observaciones sobre la alumna..."
        ></textarea>
      </div>

      <!-- Footer actions -->
      <div class="dialog-panel__footer">
        <button
          type="button"
          class="dialog-panel__cancel-btn"
          (click)="onCancel()"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="dialog-panel__submit-btn"
          [disabled]="submitting"
          [attr.aria-busy]="submitting"
        >
          <app-spinner *ngIf="submitting" [size]="16" class="submit-spinner"></app-spinner>
          {{ submitting ? 'Creando…' : 'Crear alumna' }}
        </button>
      </div>

    </form>

  </div>
</div>
