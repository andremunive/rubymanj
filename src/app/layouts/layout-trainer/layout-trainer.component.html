<div class="trainer-layout" [class.trainer-layout--sidebar-open]="sidebarAbierto">

  <!-- Overlay mobile: aparece cuando el sidebar está abierto en pantallas pequeñas -->
  <div
    *ngIf="sidebarAbierto"
    class="trainer-layout__overlay"
    (click)="cerrarSidebarEnMobile()"
    aria-hidden="true"
  ></div>

  <!-- Sidebar -->
  <aside class="trainer-layout__sidebar" role="navigation" aria-label="Menú principal">

    <div class="sidebar__header">
      <a routerLink="/trainer" class="sidebar__brand" aria-label="Ir al inicio">
        <app-logo [size]="18"></app-logo>
      </a>
      <button
        class="sidebar__close-btn"
        type="button"
        (click)="toggleSidebar()"
        aria-label="Cerrar menú"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <nav class="sidebar__nav">
      <ul class="sidebar__menu" role="list">
        <li>
          <a
            routerLink="/trainer"
            routerLinkActive="sidebar__link--active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="sidebar__link"
            (click)="cerrarSidebarEnMobile()"
          >
            <svg class="sidebar__link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Inicio</span>
          </a>
        </li>
        <li>
          <a
            routerLink="/trainer/alumnas"
            routerLinkActive="sidebar__link--active"
            class="sidebar__link"
            (click)="cerrarSidebarEnMobile()"
          >
            <svg class="sidebar__link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Mis alumnas</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__user" *ngIf="user">
        <div class="sidebar__user-avatar" aria-hidden="true">
          {{ user.fullName.charAt(0).toUpperCase() }}
        </div>
        <div class="sidebar__user-info">
          <span class="sidebar__user-name">{{ user.fullName }}</span>
          <span class="sidebar__user-role">Entrenadora</span>
        </div>
      </div>
      <button
        type="button"
        class="sidebar__logout-btn"
        (click)="logout()"
        [disabled]="cerrando"
        aria-label="Cerrar sesión"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>{{ cerrando ? 'Saliendo…' : 'Cerrar sesión' }}</span>
      </button>
    </div>
  </aside>

  <!-- Área principal -->
  <div class="trainer-layout__main">
    <!-- Topbar mobile -->
    <header class="trainer-layout__topbar">
      <button
        class="topbar__menu-btn"
        type="button"
        (click)="toggleSidebar()"
        aria-label="Abrir menú"
        [attr.aria-expanded]="sidebarAbierto"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a routerLink="/trainer" class="topbar__brand" aria-label="Ir al inicio">
        <app-logo [size]="16"></app-logo>
      </a>
      <div class="topbar__spacer" aria-hidden="true"></div>
    </header>

    <main class="trainer-layout__content" id="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
