<div class="trainer-layout">

  <!-- ── Top toolbar ── -->
  <header class="toolbar" role="banner">

    <!-- Brand -->
    <a routerLink="/trainer" class="toolbar__brand" aria-label="Ir al inicio">
      <app-logo [size]="18"></app-logo>
    </a>

    <!-- Main nav (desktop) -->
    <nav class="toolbar__nav" role="navigation" aria-label="Menú principal">
      <ul class="toolbar__menu" role="list">
        <li>
          <a
            routerLink="/trainer"
            routerLinkActive="toolbar__link--active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="toolbar__link"
          >
            <svg class="toolbar__link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Inicio</span>
          </a>
        </li>
        <li>
          <a
            routerLink="/trainer/alumnas"
            routerLinkActive="toolbar__link--active"
            class="toolbar__link"
          >
            <svg class="toolbar__link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Mis alumnas</span>
          </a>
        </li>
        <li>
          <a
            routerLink="/trainer/entrenamiento"
            routerLinkActive="toolbar__link--active"
            class="toolbar__link"
          >
            <svg class="toolbar__link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6.5 6.5 17.5 17.5"></path>
              <path d="m21 21-1-1"></path>
              <path d="m3 3 1 1"></path>
              <path d="m18 22 4-4"></path>
              <path d="m2 6 4-4"></path>
              <path d="m3 10 7-7"></path>
              <path d="m14 21 7-7"></path>
            </svg>
            <span>Entrenamiento</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Right side: user + mobile menu toggle -->
    <div class="toolbar__right">

      <!-- User dropdown (desktop ≥768px) -->
      <div class="toolbar__user-wrapper" *ngIf="user">
        <button
          type="button"
          class="toolbar__user-btn"
          (click)="toggleUserMenu($event)"
          [attr.aria-expanded]="userMenuAbierto"
          aria-haspopup="menu"
          aria-label="Abrir menú de usuario"
        >
          <span class="toolbar__user-avatar" aria-hidden="true">
            {{ user.fullName.charAt(0).toUpperCase() }}
          </span>
          <span class="toolbar__user-name">{{ user.fullName }}</span>
          <svg class="toolbar__user-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div
          *ngIf="userMenuAbierto"
          class="toolbar__user-menu"
          role="menu"
          (click)="$event.stopPropagation()"
        >
          <div class="toolbar__user-menu-header">
            <span class="toolbar__user-menu-name">{{ user.fullName }}</span>
            <span class="toolbar__user-menu-role">Entrenadora</span>
          </div>
          <button
            type="button"
            class="toolbar__user-menu-item"
            role="menuitem"
            (click)="logout()"
            [disabled]="cerrando"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>{{ cerrando ? 'Saliendo…' : 'Cerrar sesión' }}</span>
          </button>
        </div>
      </div>

      <!-- Mobile hamburger -->
      <button
        class="toolbar__menu-btn"
        type="button"
        (click)="toggleMenu()"
        aria-label="Abrir menú"
        [attr.aria-expanded]="menuAbierto"
      >
        <svg *ngIf="!menuAbierto" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg *ngIf="menuAbierto" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

    </div>

    <!-- Mobile drawer -->
    <div class="toolbar__mobile-drawer" *ngIf="menuAbierto" role="dialog" aria-label="Menú">
      <nav class="mobile-drawer__nav" aria-label="Menú principal">
        <ul class="mobile-drawer__menu" role="list">
          <li>
            <a
              routerLink="/trainer"
              routerLinkActive="mobile-drawer__link--active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="mobile-drawer__link"
              (click)="cerrarMenu()"
            >
              <span>Inicio</span>
            </a>
          </li>
          <li>
            <a
              routerLink="/trainer/alumnas"
              routerLinkActive="mobile-drawer__link--active"
              class="mobile-drawer__link"
              (click)="cerrarMenu()"
            >
              <span>Mis alumnas</span>
            </a>
          </li>
          <li>
            <a
              routerLink="/trainer/entrenamiento"
              routerLinkActive="mobile-drawer__link--active"
              class="mobile-drawer__link"
              (click)="cerrarMenu()"
            >
              <span>Entrenamiento</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="mobile-drawer__footer" *ngIf="user">
        <div class="mobile-drawer__user">
          <span class="mobile-drawer__user-avatar" aria-hidden="true">
            {{ user.fullName.charAt(0).toUpperCase() }}
          </span>
          <div class="mobile-drawer__user-info">
            <span class="mobile-drawer__user-name">{{ user.fullName }}</span>
            <span class="mobile-drawer__user-role">Entrenadora</span>
          </div>
        </div>
        <button
          type="button"
          class="mobile-drawer__logout-btn"
          (click)="logout()"
          [disabled]="cerrando"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>{{ cerrando ? 'Saliendo…' : 'Cerrar sesión' }}</span>
        </button>
      </div>
    </div>

  </header>

  <!-- Main content -->
  <main class="trainer-layout__content" id="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
